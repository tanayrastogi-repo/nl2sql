[project]
name = "nl2sql"
version = "0.1.0"
description = "Simple tool to convert natural language to SQL queries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=1.0.0",
    "langsmith>=0.1.0",
    "pydantic>=2.0",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
]

[project.scripts]
nl2sql = "nl2sql:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"nl2sql.py" = "nl2sql.py"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "mypy>=1.20.2",
]
